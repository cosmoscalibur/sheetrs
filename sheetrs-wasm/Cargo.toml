[package]
name = "sheetrs-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for the SheetRS linter and statistics"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sheetrs-core = { path = "../sheetrs-core", version = "0.3.3" }
sheetrs-linter = { path = "../sheetrs-linter", version = "0.3.3", default-features = false }
sheetrs-stats = { path = "../sheetrs-stats", version = "0.3.3" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
