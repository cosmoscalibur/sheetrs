[package]
name = "sheetrs-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings of the SheetRS suite: the Book, which lints, reads, edits, calculates, inspects and compiles workbooks in memory"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["query", "edit", "calculate"]
# `Book.query`, `range`, `find`: the cells of a range, a sheet or the workbook, and the search.
query = ["dep:sheetrs-query", "dep:sheetrs-protocol"]
# the operations of `Book` (delete sheets, names, rows and columns, formulas to values, replace, and
# the `calculate` step), `save`, `outputs`, `explain` (the planner carries the engine).
edit = ["dep:sheetrs-edit", "dep:sheetrs-protocol"]
# `Book.inspect`, `evaluateFormula`: the compiler and
# the engine, in memory.
calculate = ["dep:sheetrs-compiler", "dep:sheetrs-engine", "edit"]
# `Book.compile`: the compiler in the package. It carries the two base modules of the WebAssembly
# target inside (`SHEETRS_RT_DIR` is the folder with `sheetrs-rt.wasm` and `sheetrs-rt-template.wasm`,
# built by `scripts/build-wasm-rt.sh`; `scripts/package-wasm.sh` does it all), so it is off by default:
# a plain `cargo build` has no bases to carry.
bundled-runtime = ["calculate"]

[dependencies]
sheetrs-io = { path = "../sheetrs-io", version = "0.4.0" }
sheetrs-query = { path = "../sheetrs-query", version = "0.4.0", optional = true }
sheetrs-edit = { path = "../sheetrs-edit", version = "0.4.0", optional = true }
sheetrs-protocol = { path = "../sheetrs-protocol", version = "0.4.0", optional = true }
sheetrs-compiler = { path = "../sheetrs-compiler", version = "0.4.0", optional = true }
sheetrs-engine = { path = "../sheetrs-engine", version = "0.4.0", optional = true }
sheetrs-linter = { path = "../sheetrs-linter", version = "0.4.0", default-features = false }
sheetrs-stats = { path = "../sheetrs-stats", version = "0.4.0" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
