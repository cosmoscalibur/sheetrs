[package]
name = "sheetrs-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Input and output of the SheetRS suite: the Book (a workbook from a file or bytes), the workbook model, the XLSX/ODS readers and, with the feature `write`, the writers"

[features]
# The writers of XLSX and ODS (`write`): a workbook rewritten as a stream. Off by default.
write = ["dep:tempfile", "dep:sheetrs-protocol", "dep:serde_json"]

[dependencies]
sheetrs-formula = { path = "../sheetrs-formula", version = "0.4.1" }
sheetrs-protocol = { path = "../sheetrs-protocol", version = "0.4.1", optional = true }

serde.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
zip.workspace = true
regex.workspace = true
aho-corasick.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tempfile = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.27"
anyhow.workspace = true
# The tests of the writers run with the feature `write` on.
sheetrs-io = { path = ".", features = ["write"] }

[lints]
workspace = true
