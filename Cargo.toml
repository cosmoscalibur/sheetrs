[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cosmoscalibur/sheetrs"
authors = ["Edward Villegas-Pulgarin"]

[workspace.dependencies]
sheetrs-core = { path = "crates/sheetrs-core" }
sheetrs-testkit = { path = "crates/sheetrs-testkit" }
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
