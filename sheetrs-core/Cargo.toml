[package]
name = "sheetrs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Excel/ODS linting with hierarchical violation reporting"

[dependencies]
sheetrs-formula = { path = "../sheetrs-formula" }

serde.workspace = true
toml.workspace = true
anyhow.workspace = true
quick-xml.workspace = true
zip.workspace = true
reqwest = { workspace = true, optional = true }
regex.workspace = true
aho-corasick.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "wasmbind"] }

[features]
default = ["link-validation"]
link-validation = ["reqwest"]

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
