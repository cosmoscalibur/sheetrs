[package]
name = "sheetrs-linter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Spreadsheet linter: rules, configuration and violations (library) and the `sheetrs lint` subcommand"


[lib]
name = "sheetrs_linter"
path = "src/lib.rs"

[features]
default = ["link-validation"]
# EXT802 checks the URLs of the workbook over HTTP. Not available for WASM.
link-validation = ["dep:reqwest"]
# The `sheetrs lint` subcommand (clap arguments and `run`), for the `sheetrs` executable.
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
sheetrs-io = { path = "../sheetrs-io", version = "0.4.0" }
sheetrs-formula = { path = "../sheetrs-formula", version = "0.4.0" }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
regex.workspace = true
aho-corasick.workspace = true
colored.workspace = true
serde_json = "1.0.154"
reqwest = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "wasmbind"] }

[dev-dependencies]
zip.workspace = true
tempfile.workspace = true
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
