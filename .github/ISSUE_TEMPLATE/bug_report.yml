name: Bug Report
description: Report a bug in sheetrs, sheetlint, sheetstats, or sheetedit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `sheetlint file.xlsx`
        2. Observe the output
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - sheetlint
        - sheetstats
        - sheetedit
        - sheetrs-core (library)
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: File Format
      options:
        - XLSX
        - ODS
        - Both
        - N/A
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sheetlint --version` or `cargo pkgid sheetrs-core`
      placeholder: "0.3.2"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: false
  - type: textarea
    id: file
    attributes:
      label: Reproduction File
      description: If possible, attach a minimal XLSX/ODS file that reproduces the issue.
    validations:
      required: false
