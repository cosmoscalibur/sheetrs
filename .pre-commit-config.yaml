repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: fixtures-deterministic
        name: fixtures do not depend on the time they were generated
        entry: python3 scripts/fixture_determinism.py --check
        language: system
        files: \.(xlsx|xlsm|ods)$
