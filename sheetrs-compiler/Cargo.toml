[package]
name = "sheetrs-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compiler from XLSX/ODS spreadsheets to standalone executables: loader, dependency analysis, constant folding, input/output pruning"

[lib]
name = "sheetrs_compiler"
path = "src/lib.rs"

[[bin]]
name = "sheetc"
path = "src/main.rs"
required-features = ["load"]

[features]
default = ["load"]
# Frontend that reads XLSX/ODS files through the sheetrs-io readers.
load = ["dep:sheetrs-io", "dep:sheetrs-answer", "dep:sha2"]
# `SHEETC_FLAMEGRAPH=out.svg sheetc …` writes a sampled flamegraph (no perf needed).
profile = ["dep:pprof"]

[dependencies]
sheetrs-protocol = { path = "../sheetrs-protocol", version = "0.4.0" }
sheetrs-engine = { path = "../sheetrs-engine", version = "0.4.0" }
sheetrs-formula = { path = "../sheetrs-formula", version = "0.4.0" }
sheetrs-io = { path = "../sheetrs-io", version = "0.4.0", default-features = false, optional = true }
sheetrs-answer = { path = "../sheetrs-answer", version = "0.4.0", optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
pprof = { version = "0.14", optional = true, default-features = false, features = ["flamegraph"] }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
wasm-encoder = "0.245"
wasmparser = "0.245"

[lints]
workspace = true
