[package]
name = "sheetrs-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Statistics of XLSX and ODS workbooks: sheets, cells, formulas, errors, names and macros, counted in one streaming pass (the library, and the `sheetrs stats` subcommand)"

[lib]
name = "sheetrs_stats"
path = "src/lib.rs"

[features]
# The `sheetrs stats` subcommand (clap arguments and `run`), for the `sheetrs` executable.
cli = ["dep:clap", "dep:anyhow", "dep:serde_json"]

[dependencies]
sheetrs-io = { path = "../sheetrs-io", version = "0.4.1" }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde.workspace = true
serde_json = { version = "1.0.154", optional = true }
zip.workspace = true

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
