[package]
name = "sheetrs-rt-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The runtime of a compiled workbook as a WebAssembly module: the base that `sheetc build --target wasm` completes with a program"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The module that also writes the workbook (the template of `--embed-template`):
# it carries the readers and writers of XLSX and ODS.
template = ["dep:sheetrs-answer", "dep:sheetrs-io"]

[dependencies]
sheetrs-engine = { path = "../sheetrs-engine", version = "0.4.0" }
sheetrs-answer = { path = "../sheetrs-answer", version = "0.4.0", optional = true }
sheetrs-io = { path = "../sheetrs-io", version = "0.4.0", default-features = false, optional = true }
serde_json.workspace = true

[dev-dependencies]
sheetrs-compiler = { path = "../sheetrs-compiler", version = "0.4.0" }
sheetrs-io = { path = "../sheetrs-io", version = "0.4.0", default-features = false }

[lints]
workspace = true
